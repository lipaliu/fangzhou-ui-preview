font-weight:550;margin:0 0 12px}.project p{font-size:11px;color:#888;display:flex;justify-content:space-between;margin:0}.badge{font-size:10px;color:#50724b;background:#ecf3e9;padding:5px 9px;border-radius:15px}.project .progress{height:4px;background:#ededf1;border-radius:5px;margin:17px 0}.progress i{display:block;width:64%;height:4px;border-radius:5px;background:#86a4d8}.taskbar{border-radius:17px;background:#f5f5f7;padding:19px 22px;display:flex;justify-content:space-between;font-size:12px;margin-top:22px;color:#74747c}.composer{max-width:780px;margin:10px auto 0}.composer .welcome{display:block;text-align:center;margin-bottom:30px}.inputcard{border:1px solid #e3e3ea;border-radius:23px;padding:23px;background:white;box-shadow:0 14px 40px #2c3f6410}.inputcard textarea{resize:vertical;border:0;outline:0;min-height:120px;width:100%;font-size:16px;line-height:1.7;color:#222}.refs{display:flex;gap:10px;margin:10px 0 24px}.ref{width:75px;height:80px;border:1px solid #ddd;border-radius:12px;object-fit:cover;object-position:top}.attach{border:1px dashed #c8c8d0;border-radius:12px;width:75px;background:#f8f8fa;font-size:24px;color:#999}.controls{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid #eee}.controls button{padding:9px 13px;background:#f3f3f6;border-radius:12px;font-size:11px}.submit{display:flex;align-items:center;justify-content:space-between;padding-top:19px}.submit span{font-size:11px;color:#85858b}.history{display:flex;justify-content:space-between;padding:24px 4px;font-size:12px;color:#85858b}.notes{margin:26px 4% 40px;display:grid;grid-template-columns:1fr 1fr;gap:30px}.notes h2{font-size:19px;font-weight:550}.notes p{font-size:12px;line-height:1.9;color:#74747c}.notes a{font-size:12px;color:#0066cc;display:inline-block;margin-right:20px}.disclaimer{font-size:11px;color:#999;padding:0 4% 35px;line-height:1.8}dialog{border:0;border-radius:22px;padding:30px;width:440px;max-width:90vw;box-shadow:0 20px 90px #0003}dialog::backdro </style><header><div><small>FANGZHOU / INTERIOR STYLE STUDY</small><h1>内部，也让内容成为主角。</h1></div><a href="editorial-30.html?view=08">已选08首页 ↗</a></header><nav aria-label="风格参考"><button data-id="A">A · 内容橱窗</button><button data-id="B">B · 项目工作台</button><button data-id="C">C · 专注创作</button></nav><section class="demo"><div class="top"><span class="logo" aria-label="方舟"><span class="logo-crop"><img src="assets/fangzhou-logo-light-transparent-v1.png" alt="FANGZHOU"></span></span><div><b>工作台</b><span>素材库</span><span>任务</span><span class="avatar">L</span></div></div><div class="body" id="stage"></div></section><section class="notes"><div><h2 id="heading"></h2><p id="reason"></p></div><div><h2>视觉来源与适配</h2><p>参考 Apple 官网的产品与能力展示，下面的方舟排版由本项目独立设计。参考入口保留原站；卡片配色、数值和控件不声称是 Apple 官方规范。</p><a href="https://www.apple.com/mac/" target="_blank" rel="noreferrer">Apple Mac 原站 ↗</a><a href="https://www.apple.com/apple-intelligence/" target="_blank" rel="noreferrer">Apple Intelligence 原站 ↗</a></div></section><div class="disclaimer">本页是三种内部视觉方向，尚未获选定。演示素材与交互不代表账号、模型、费用或生成服务已接入。用户分享的抖音图文暂未成功读取，本页不冒称复刻其公式。</div><dialog><h2 id="dialog-title"></h2><p>这是风格演示。实际功能将在选定方向后与方舟现有工作流衔接。</p><button id="close">返回预览</button></dialog><script>
const img=n=>'assets/'+n;const yellow=img('editorial/photo-6.jpg'),portrait=img('editorial/photo-2.jpg'),city=img('editorial/photo-1.jpg');
const mini=(photo,title)=>`<div class="mini"><img src="${photo}" alt=""><div>${title}<small>示例项目 · 最近编辑</small></div></div>`;
const views={
A:{title:'A · 一张卡片，只讲一件事。',reason:'适合登录后的发现与功能入口。大图承担情绪和内容识别，标题说明能做什么，右下角统一进入。白色、浅紫与暖色分配给不同内容区域，避免整页发灰。',html:`<div class="welcome"><div><h2>今天，想创造什么？</h2><p>用 AI，想象内容的下一种可能。</p></div><button class="blue" data-open="开始创作">开始创作 ＋</button></div><div class="grid"><button class="card photo" data-open="影像创作"><img src="${yellow}" alt="黄色服装影像"><div class="txt"><small>影像创作</small><h3>让想象，<br>有自己的画面。</h3></div><span class="plus">+</span></button><button class="card lavender" data-open="分镜构思"><div class="txt"><small>分镜构思</small><h3>从一句话，<br>到一场戏。</h3></div><div class="visual"><span></span><span></span><img src="${city}" alt="城市参考"></div><span class="plus">+</span></button><button class="card warm" data-open="素材整理"><div class="txt"><small>素材整理</small><h3>好灵感，<br>都有迹可循。</h3><p>人物、场景、风格，<br>收进你的创作资料库。</p></div><div class="visual" style="bottom:-12px;left:30%;transform:rotate(9deg)"><img style="height:140px" src="${portrait}" alt="人物参考"></div><span class="plus">+</span></button></div><div class="minirow">${mini(yellow,'日光服装企划')}${mini(city,'城市影像手记')}${mini(portrait,'人物专题')}</div>`},
B:{title:'B · 卡片成为项目的入口。',reason:'适合持续工作的团队。每张卡片保持同样的大图比例，下面固定放项目名称、状态和更新信息。浏览时不堆参数，进入项目后再展开任务与素材。',html:`<div class="welcome"><div><h2>继续你的创作。</h2><p>把画面、素材和进度，放在同一个地方。</p></div><button class="blue" data-open="新建项目">新建项目 ＋</button></div><div class="projectgrid">${[[yellow,'日光服装企划','制作中'],[city,'城市影像手记','整理中'],[portrait,'人物专题','已完成']].map(([photo,name,status])=>`<button class="project" data-open="${name}"><img src="${photo}" alt="${name}"><div><h3>${name}</h3><p><span>示例项目 / 影像</span><span class="badge">${status}</span></p><div class="progress"><i></i></div><p><span>点击查看项目</span><span>↗</span></p></div></button>`).join('')}</div><div class="taskbar"><span>任务概览</span><span>暂无真实运行任务 · 服务待接入</span></div>`},
C:{title:'C · 把创作集中在一张卡片里。',reason:'适合进入具体生成任务之后。描述是第一视觉重点，参考图紧随其后；模型、比例和费用保持可见，更多参数按需展开。已有作品留在输入区下方，避免空预览抢占首屏。',html:`<div class="composer"><div class="welcome"><h2>从一个想法开始。</h2><p>用 AI，想象内容的下一种可能。</p></div><div class="inputcard"><textarea aria-label="创作描述" placeholder="描述画面、镜头与情绪……">明亮的日光，一组充满力量感的黄色服装影像。</textarea><div class="refs"><img class="ref" src="${yellow}" alt="已选参考图片"><button class="attach" data-open="添加参考" aria-label="添加参考">＋</button></div><div class="controls"><button data-open="生成类型">图片 ▾</button><button data-open="选择模型">模型待接入 ▾</button><button data-open="输出比例">16:9 ▾</button><button data-open="更多设置">更多设置</button></div><div class="submit"><span>预估费用：待接入报价</span><button class="blue" data-open="生成预览">开始生成 ↗</button></div></div><div class="history"><span>近期作品</span><span>查看全部 ↗</span></div><div class="minirow" style="margin-top:0">${mini(yellow,'日光服装企划')}${mini(city,'城市影像手记')}${mini(portrait,'人物专题')}</div></div>`}};
function show(id){const v=views[id]||views.A;document.querySelector('#stage').innerHTML=v.html;document.querySelector('#heading').textContent=v.title;document.querySelector('#reason').textContent=v.reason;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));history.replaceState(null,'','?style='+id);document.title='方舟内部参考 · '+v.title;}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.id));document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b){document.querySelector('#dialog-title').textContent=b.dataset.open;document.querySelector('dialog').showModal();}});document.querySelector('#close').onclick=()=>document.querySelector('dialog').close();show(new URLSearchParams(location.search).get('style')||'A');
</script></html>
